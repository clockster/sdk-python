name: Specification drift

# Nightly rather than per pull request: the API deploys on its own schedule, and a change there
# would otherwise turn unrelated pull requests red.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - run: python scripts/sync_spec.py --check
